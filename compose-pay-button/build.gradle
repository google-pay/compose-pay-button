plugins {
    alias(libs.plugins.kotlin.multiplatform)
    alias(libs.plugins.androidLibrary)
    alias(libs.plugins.compose.compiler)
    alias(libs.plugins.compose.multiplatform)
}

ext {
    PUBLISH_GROUP_ID = 'com.google.pay.button'
    PUBLISH_VERSION = '1.2.0'
    PUBLISH_ARTIFACT_ID = 'compose-pay-button'
}

apply from: "${rootProject.projectDir}/scripts/publish-module.gradle"

android {
    namespace 'com.google.pay.button'
    description 'Google Pay Button for Jetpack Compose'
    compileSdkVersion 37

    defaultConfig {
        minSdk 21

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        compose true
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            //withJavadocJar()
        }
    }
    lint {
        targetSdk 37
    }
    testOptions {
        targetSdk 37
    }
}
kotlin {
    androidTarget {
        publishLibraryVariants("release")
    }
    js(IR) {
        browser()
    }
    wasmJs {
        browser()
    }

    sourceSets {
        commonMain {
            dependencies {
                implementation compose.runtime
                implementation compose.ui
                implementation compose.foundation
                implementation compose.material
                implementation compose.components.resources
            }
        }
        androidMain {
            dependencies {
                implementation libs.playServices.wallet
                implementation libs.androidx.core
            }
        }
        jsMain {
            dependencies {
                implementation compose.ui
            }
        }
        wasmJsMain {
            dependencies {
                implementation compose.ui
            }
        }
    }
}

tasks.register("printWasmJsClasspath") {
    doLast {
        configurations.getByName("wasmJsCompileClasspath").files.forEach {
            println(it.absolutePath)
        }
    }
}