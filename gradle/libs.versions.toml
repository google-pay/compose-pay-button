[versions]
kotlin = "2.4.0"

[libraries]
# Library
compose-ui = "androidx.compose.ui:ui:1.11.4"
compose-material = "androidx.compose.material:material:1.11.4"
androidx-core = "androidx.core:core-ktx:1.19.0"
playServices-wallet = "com.google.android.gms:play-services-wallet:20.0.0"

# Sample/App
sample-compose-ui-tooling = "androidx.compose.ui:ui-tooling-preview:1.11.4"
sample-compose-activity = "androidx.activity:activity-compose:1.13.0"

[plugins]
nexusPublishingPlugin = "io.github.gradle-nexus.publish-plugin:2.0.0"
androidApplication = "com.android.application:9.2.1"
androidLibrary = "com.android.library:9.2.1"
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version = "1.11.1" }